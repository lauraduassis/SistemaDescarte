<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Editar Perfil | Sistema de Descarte</title><link rel="stylesheet" th:href="@{/css/app.css}"><script type="module" th:src="@{/js/app.js}"></script></head>
<body x-data="{}"><div class="app-layout"><div th:replace="~{fragments/sidebar :: sidebar}"></div><div class="main-area"><div th:replace="~{fragments/header :: header}"></div><main class="content"><div class="perfil-pagina">
<h2 class="text-3xl font-bold text-slate-800 mb-2">Editar Perfil</h2><p class="text-slate-600 mb-6">Altere apenas seu nome de usuario. A funcao nao pode ser modificada aqui.</p>
<section class="perfil-cartao"><p th:if="${erroPerfil}" class="perfil-mensagem erro" th:text="${erroPerfil}"></p>
<form method="post" th:action="@{/perfil/editar}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<div class="perfil-grid"><div class="perfil-campo"><label for="usuarioPerfil">Nome de usuario (login)</label><input id="usuarioPerfil" type="text" name="usuario" minlength="3" maxlength="100" required autocomplete="username" th:value="${perfilUsuario.usuario}"></div>
<div class="perfil-campo"><label for="permissaoPerfil">Funcao / permissao (somente leitura)</label><input id="permissaoPerfil" readonly th:value="${perfilUsuario.permissao}"></div>
<div class="perfil-campo"><label for="senhaAtualPerfil">Senha atual para confirmar</label><input id="senhaAtualPerfil" type="password" name="senhaAtual" required autocomplete="current-password"></div></div>
<p class="text-sm text-slate-500 mt-5">Ao alterar o nome de usuario, voce precisara entrar novamente no sistema utilizando o novo login.</p>
<div class="perfil-acoes"><button type="submit" class="perfil-acao">Salvar alteracoes</button><a th:href="@{/meu-perfil}" class="perfil-acao secundaria">Cancelar</a></div>
</form></section></div></main><div th:replace="~{fragments/footer :: footer}"></div></div></div><div th:replace="~{fragments/components :: components}"></div></body></html>
