<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerenciar Permissões | Sistema de Descarte</title>
<link rel="stylesheet" th:href="@{/css/app.css}">
<script type="module" th:src="@{/js/app.js}"></script>
<meta name="_csrf" th:content="${_csrf.token}">
<meta name="_csrf_header" th:content="${_csrf.headerName}">
</head>
<body x-data="permissoes()">
<div class="app-layout">
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="main-area">
<div th:replace="~{fragments/header :: header}"></div>
<main class="content">
<section class="mb-8">
<span class="text-sm font-semibold uppercase tracking-wider text-blue-600">CONTROLE DE ACESSO</span>
<h2 class="mt-2 text-3xl font-bold text-slate-800">Gerenciar Permissões</h2>
<p class="mt-2 text-slate-600">Cadastre e gerencie as permissões de acesso ao sistema.</p>
</section>
<section class="bg-white rounded-xl shadow border border-slate-200 p-6 mb-8">
<h3 class="font-semibold text-lg mb-4" x-text="editandoId !== null ? 'Editar permissão' : 'Nova permissão'">Nova permissão</h3>
<form @submit.prevent="salvar()">
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="flex flex-col gap-2"><label for="roleNome">Nome da permissão</label>
<input id="roleNome" x-model="nomeFormulario" :readonly="editandoId !== null &amp;&amp; form.nome === 'SUPERADMIN'" required maxlength="40" placeholder="Ex.: AUDITOR" class="w-full rounded-lg border border-slate-300 px-3 py-2"></div>
<div class="flex flex-col gap-2"><label for="roleDescricao">Descrição</label>
<input id="roleDescricao" x-model="form.descricao" maxlength="255" placeholder="Ex.: Consulta de documentos" class="w-full rounded-lg border border-slate-300 px-3 py-2"></div>
</div>
<div class="flex justify-end gap-3 mt-6">
<button type="button" @click="limpar()" class="user-form-clear-button">Limpar / Cancelar</button>
<button type="submit" :disabled="salvando" class="user-form-save-button" x-text="salvando ? 'Salvando...' : (editandoId !== null ? 'Salvar alterações' : 'Cadastrar permissão')">Cadastrar permissão</button>
</div></form></section>
<section class="history-toolbar"><div class="history-search"><label for="buscarPermissão">Buscar</label><input id="buscarPermissão" type="search" x-model="busca" placeholder="Buscar permissão"></div></section>
<section class="panel history-panel"><div class="panel-header"><div><span class="section-label">REGISTROS</span><h3>Permissões cadastradas</h3></div></div>
<div class="table-wrapper"><table><thead><tr><th>ID</th><th>Permissão</th><th>Descrição</th><th>Ações</th></tr></thead><tbody>
<template x-for="role in filtrados" :key="role.id"><tr><td x-text="role.id"></td><td x-text="nomeExibicao(role.nome)"></td><td x-text="role.descricao"></td><td><div class="user-actions">
<button type="button"
        class="user-edit-button"
        @click="editar(role)">
    <svg width="15" height="15" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round"
         aria-hidden="true">
        <path d="M12 20h9"/>
        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L9 17l-4 1 1-4Z"/>
    </svg>
    Editar
</button>
<button type="button"
        class="user-delete-button"
        @click="solicitarExclusao(role)"
        :disabled="role.nome === 'SUPERADMIN'">
    <svg width="15" height="15" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round"
         aria-hidden="true">
        <path d="M3 6h18"/>
        <path d="M8 6V4h8v2"/>
        <path d="M19 6l-1 14H6L5 6"/>
        <path d="M10 11v5M14 11v5"/>
    </svg>
    Excluir
</button>
</div></td></tr></template>
<tr x-show="!carregando && filtrados.length === 0"><td colspan="4">Nenhuma permissão encontrada.</td></tr>
</tbody></table></div></section>
</main><div th:replace="~{fragments/footer :: footer}"></div></div></div>
<div th:replace="~{fragments/components :: components}"></div>
</body></html>
