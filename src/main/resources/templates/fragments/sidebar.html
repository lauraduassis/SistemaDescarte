<div th:fragment="sidebar" class="contents">

    <button
        type="button"
        x-cloak
        x-show="$store.sidebar.mobileOpen"
        @click="$store.sidebar.fecharMenuMobile()"
        class="fixed inset-0 z-30 bg-slate-950/50 lg:hidden"
        aria-label="Fechar menu">
    </button>

    <aside
        class="fixed inset-y-0 left-0 z-40 flex min-h-screen w-64 -translate-x-full flex-col bg-slate-900 text-white transition-all duration-200 lg:relative lg:inset-auto lg:min-h-screen lg:translate-x-0 lg:shrink-0"
        :class="[
            $store.sidebar.mobileOpen ? 'translate-x-0' : '',
            $store.sidebar.collapsed ? 'lg:w-20' : 'lg:w-64'
        ]">

        <div class="flex min-h-[68px] items-center justify-between gap-2 border-b border-slate-800 px-4 py-5">

            <div class="min-w-0">
                <h2
                    class="text-lg font-bold"
                    :class="$store.sidebar.collapsed ? 'lg:hidden' : ''">
                    Sistema de Descarte
                </h2>

                <p
                    class="text-sm text-slate-400"
                    :class="$store.sidebar.collapsed ? 'lg:hidden' : ''">
                    Almoxarifado de TI
                </p>

                <span
                    class="hidden text-lg font-bold"
                    :class="$store.sidebar.collapsed ? 'lg:inline' : ''">
                    SD
                </span>
            </div>

            <button
                type="button"
                @click="$store.sidebar.fecharMenuMobile()"
                class="rounded-lg p-2 text-slate-300 transition hover:bg-slate-800 lg:hidden"
                aria-label="Fechar menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" class="h-5 w-5" aria-hidden="true">
                    <path d="m18 6-12 12M6 6l12 12"/>
                </svg>
            </button>

        </div>

        <nav class="flex-1 space-y-2 overflow-y-auto px-3 py-6">

            <a th:if="${permissao == 'ADMIN' or permissao == 'ALMOXARIFADO' or permissao == 'ANALISTA'}" th:href="@{/}"
               th:classappend="${titulo == 'Dashboard'} ? ' sidebar-premium-active font-semibold' : ''"
               :class="$store.sidebar.collapsed ? 'lg:justify-center lg:px-0' : 'gap-3 px-3'"
               :title="$store.sidebar.collapsed ? 'Dashboard' : ''"
               class="sidebar-premium-item flex items-center gap-3 rounded-lg px-3 py-3 transition">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" class="h-5 w-5 shrink-0" aria-hidden="true">
                    <rect x="3" y="3" width="7" height="7" rx="1"/>
                    <rect x="14" y="3" width="7" height="7" rx="1"/>
                    <rect x="3" y="14" width="7" height="7" rx="1"/>
                    <rect x="14" y="14" width="7" height="7" rx="1"/>
                </svg>
                <span :class="$store.sidebar.collapsed ? 'lg:hidden' : ''">Dashboard</span>
            </a>

            <a th:if="${permissao == 'ADMIN'}" th:href="@{/admin/empresas-coletoras}"
               th:classappend="${titulo == 'Empresas Coletoras'} ? ' sidebar-premium-active font-semibold' : ''"
               :class="$store.sidebar.collapsed ? 'lg:justify-center lg:px-0' : 'gap-3 px-3'"
               :title="$store.sidebar.collapsed ? 'Empresas Coletoras' : ''"
               class="sidebar-premium-item flex items-center gap-3 rounded-lg px-3 py-3 transition">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-5 w-5 shrink-0" aria-hidden="true">
                    <path d="M3 7h11v10H3zM14 11h4l3 4v2h-7M6 17a2 2 0 1 0 4 0M16 17a2 2 0 1 0 4 0"/>
                </svg>
                <span :class="$store.sidebar.collapsed ? 'lg:hidden' : ''">Empresas Coletoras</span>
            </a>

            <a th:if="${permissao == 'ADMIN'}" th:href="@{/admin/usuarios}"
               th:classappend="${titulo == 'Usuários'} ? ' sidebar-premium-active font-semibold' : ''"
               :class="$store.sidebar.collapsed ? 'lg:justify-center lg:px-0' : 'gap-3 px-3'"
               :title="$store.sidebar.collapsed ? 'Usuários' : ''"
               class="sidebar-premium-item flex items-center gap-3 rounded-lg px-3 py-3 transition">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" class="h-5 w-5 shrink-0" aria-hidden="true">
                    <circle cx="9" cy="8" r="4"/>
                    <path d="M2 21v-2a7 7 0 0 1 14 0v2M17 4a4 4 0 0 1 0 8m2 3a5 5 0 0 1 3 4v2"/>
                </svg>
                <span :class="$store.sidebar.collapsed ? 'lg:hidden' : ''">Usuários</span>
            </a>

                        <a th:if="${permissao == 'ADMIN'}"
               th:href="@{/admin/permissoes}"
               th:classappend="${titulo == 'Gerenciar Permissões'} ? ' sidebar-premium-active font-semibold' : ''"
               :class="$store.sidebar.collapsed ? 'lg:justify-center lg:px-0' : 'gap-3 px-3'"
               :title="$store.sidebar.collapsed ? 'Gerenciar Permissões' : ''"
               class="sidebar-premium-item flex items-center gap-3 rounded-lg px-3 py-3 transition">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-5 w-5 shrink-0" aria-hidden="true">
                    <path d="M12 3 3 7v5c0 5 3.6 8.1 9 10 5.4-1.9 9-5 9-10V7l-9-4Z"/><path d="m9 12 2 2 4-4"/>
                </svg>
                <span :class="$store.sidebar.collapsed ? 'lg:hidden' : ''">Gerenciar Permissões</span>
            </a>
<a th:if="${permissao == 'ADMIN' or permissao == 'ALMOXARIFADO'}" th:href="@{/produtos}"
               th:classappend="${titulo == 'Produtos' or titulo == 'Cadastrar Produto'} ? ' sidebar-premium-active font-semibold' : ''"
               :class="$store.sidebar.collapsed ? 'lg:justify-center lg:px-0' : 'gap-3 px-3'"
               :title="$store.sidebar.collapsed ? 'Produtos' : ''"
               class="sidebar-premium-item flex items-center gap-3 rounded-lg px-3 py-3 transition">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" class="h-5 w-5 shrink-0" aria-hidden="true">
                    <path d="m12 3 9 5-9 5-9-5 9-5Z"/>
                    <path d="m3 8 9 5 9-5M3 8v9l9 5 9-5V8M12 13v9"/>
                </svg>
                <span :class="$store.sidebar.collapsed ? 'lg:hidden' : ''">Produtos</span>
            </a>

            <a th:if="${permissao == 'ADMIN' or permissao == 'ALMOXARIFADO'}" th:href="@{/efetuar-descarte}"
               th:classappend="${titulo == 'Efetuar Descarte'} ? ' sidebar-premium-active font-semibold' : ''"
               :class="$store.sidebar.collapsed ? 'lg:justify-center lg:px-0' : 'gap-3 px-3'"
               :title="$store.sidebar.collapsed ? 'Efetuar Descarte' : ''"
               class="sidebar-premium-item flex items-center gap-3 rounded-lg px-3 py-3 transition">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" class="h-5 w-5 shrink-0" aria-hidden="true">
                    <path d="M4 7h16M6 3h12l2 4v13H4V7l2-4Z"/>
                    <path d="m9 13 2 2 4-4"/>
                </svg>
                <span :class="$store.sidebar.collapsed ? 'lg:hidden' : ''">Efetuar Descarte</span>
            </a>

            <a th:if="${permissao == 'ADMIN' or permissao == 'ALMOXARIFADO'}" th:href="@{/historico}"
               th:classappend="${titulo == 'Histórico'} ? ' sidebar-premium-active font-semibold' : ''"
               :class="$store.sidebar.collapsed ? 'lg:justify-center lg:px-0' : 'gap-3 px-3'"
               :title="$store.sidebar.collapsed ? 'Histórico' : ''"
               class="sidebar-premium-item flex items-center gap-3 rounded-lg px-3 py-3 transition">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" class="h-5 w-5 shrink-0" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"/>
                    <path d="M12 7v5l3 2M4 4v5h5"/>
                </svg>
                <span :class="$store.sidebar.collapsed ? 'lg:hidden' : ''">Histórico</span>
            </a>

            <div class="space-y-1">

    <button
        type="button"
        @click="$store.sidebar.alternarRelatorios()"
        th:classappend="${titulo == 'Relatórios'} ? ' sidebar-premium-parent-active' : ''"
        :aria-expanded="$store.sidebar.relatoriosAberto"
        class="sidebar-premium-item flex w-full items-center gap-3 rounded-lg px-3 py-3 text-left transition"
        :class="$store.sidebar.collapsed ? 'lg:justify-center lg:px-0' : ''">

        <svg viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8"
             class="h-5 w-5 shrink-0" aria-hidden="true">
            <path d="M4 19V5M4 19h17"/>
            <rect x="7" y="11" width="3" height="5" rx=".5"/>
            <rect x="13" y="7" width="3" height="9" rx=".5"/>
            <rect x="19" y="3" width="2" height="13" rx=".5"/>
        </svg>

        <span class="flex-1"
              :class="$store.sidebar.collapsed ? 'lg:hidden' : ''">
            Relatórios
        </span>

        <svg viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2"
             class="h-4 w-4 transition-transform"
             :class="$store.sidebar.relatoriosAberto ? 'rotate-180' : ''"
             x-show="!$store.sidebar.collapsed"
             aria-hidden="true">
            <path d="m6 9 6 6 6-6"/>
        </svg>
    </button>

    <div
        x-cloak
        x-show="$store.sidebar.relatoriosAberto"
        :class="$store.sidebar.collapsed ? 'lg:hidden' : ''"
        class="ml-5 space-y-1 border-l border-slate-700 pl-3">

        <a th:href="@{/relatorios(tipo='visao-geral')}"
           th:classappend="${tipoRelatorio == 'visao-geral'} ? ' sidebar-premium-active' : ''"
           class="sidebar-premium-subitem block rounded-lg px-3 py-2 text-sm transition">
            Visão geral
        </a>

        <a th:href="@{/relatorios(tipo='movimentacao-estoque')}"
           th:classappend="${tipoRelatorio == 'movimentacao-estoque'} ? ' sidebar-premium-active' : ''"
           th:attr="aria-current=${tipoRelatorio == 'movimentacao-estoque' ? 'page' : null}"
           class="sidebar-premium-subitem block rounded-lg px-3 py-2 text-sm transition">
            Movimentação de estoque
        </a>

        <a th:href="@{/relatorios(tipo='status')}"
           th:classappend="${tipoRelatorio == 'status'} ? ' sidebar-premium-active' : ''"
           class="sidebar-premium-subitem block rounded-lg px-3 py-2 text-sm transition">
            Relatório por Status
        </a>

                <a th:each="codigo : ${statusRelatorios}"
           th:classappend="${tipoRelatorio == 'por-status' and statusRelatorioAtual == codigo} ? ' sidebar-premium-active' : ''"
           th:href="@{/relatorios(tipo='por-status',status=${codigo})}"
           th:text="${#strings.capitalizeWords(#strings.toLowerCase(#strings.replace(codigo, '_', ' ')))}"
           class="sidebar-premium-subitem block rounded-lg px-3 py-2 text-sm transition">
            Status
        </a>

    </div>
</div>

                    <a th:if="${permissao == 'ADMIN' or permissao == 'ALMOXARIFADO' or permissao == 'ANALISTA'}"
               th:href="@{/consulta-coletas}"
               th:classappend="${titulo == 'Consulta de Coletas'} ? ' sidebar-premium-active font-semibold' : ''"
               :class="$store.sidebar.collapsed ? 'lg:justify-center lg:px-0' : 'gap-3 px-3'"
               :title="$store.sidebar.collapsed ? 'Consulta de Coletas' : ''"
               class="sidebar-premium-item flex items-center gap-3 rounded-lg px-3 py-3 transition">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-5 w-5 shrink-0" aria-hidden="true">
                    <path d="M3 5h18v14H3zM7 9h10M7 13h7"/>
                </svg>
                <span :class="$store.sidebar.collapsed ? 'lg:hidden' : ''">Consulta de Coletas</span>
            </a>
        </nav>

        <div
            class="border-t border-slate-800 px-4 py-4 text-xs text-slate-400"
            :class="$store.sidebar.collapsed ? 'lg:hidden' : ''">
            Secretaria da Educação
        </div>

    </aside>
</div>
