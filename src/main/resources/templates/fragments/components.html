<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="components">

    <!-- TOAST -->
    <div
        
        x-show="$store.alert.mostrar"
        x-cloak
        x-transition
        class="fixed top-5 right-5 z-50 w-96">

        <div class="rounded-xl shadow-xl border bg-white overflow-hidden">

            <div class="px-5 py-4">

                <h3 class="font-semibold text-slate-800"
                    x-text="$store.alert.titulo"></h3>

                <p class="mt-1 text-sm text-slate-600"
                   x-text="$store.alert.mensagem"></p>

            </div>

        </div>

    </div>

    <!-- MODAL -->
    <div
        x-data="modal()"
        x-show="mostrar"
        x-cloak
        x-transition
        class="fixed inset-0 z-50 flex items-center justify-center">

        <div class="w-full max-w-md rounded-xl bg-white shadow-2xl">

            <div class="p-6">

                <h2 class="text-lg font-semibold"
                    x-text="titulo"></h2>

                <p class="mt-3 text-slate-600"
                   x-text="mensagem"></p>

            </div>

            <div class="flex justify-end gap-3 border-t p-4">

                <button
                    @click="fechar()"
                    class="button-cancel">

                    Cancelar

                </button>

                <button
                    @click="confirmar()"
                    class="button-save"
                    x-text="textoConfirmar">

                </button>

            </div>

        </div>

    </div>

</th:block>
